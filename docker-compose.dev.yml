services:
  postgres:
    image: postgres:16-alpine
    container_name: chudbot-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: economy
    ports:
      - "5432:5432"
    volumes:
      - chudbot-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d economy"]
      interval: 2s
      timeout: 5s
      retries: 20

  bot:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      CHUDBOT_ENVIRONMENT: dev
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/economy
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "index.py"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      CHUDBOT_ENVIRONMENT: dev
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/economy
      WEB_WS_HOST: 0.0.0.0
      WEB_WS_PORT: 8765
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8765:8765"
    command: ["python", "-m", "chudbot.websocketserver.web_server"]

volumes:
  chudbot-dev-postgres:
